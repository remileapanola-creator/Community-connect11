<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Connect | Admin Login</title>
    <meta name="description" content="Secure administrator sign-in for the Community Connect admin panel.">
    <meta name="theme-color" content="#0f172a">
    <link rel="canonical" href="https://communityconnect.example/admin-login.html">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        /* Animated Gradient Flow background */
        .bg-animated-gradient {
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #311042, #0284c7, #4f46e5, #0f172a);
            background-size: 400% 400%;
            animation: gradientFlow 15s ease infinite;
        }

        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Glassmorphism card */
        .glass-card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        /* Floating particles background effect */
        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            pointer-events: none;
            animation: float 10s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); opacity: 0.3; }
            50% { transform: translateY(-40px) scale(1.2); opacity: 0.7; }
        }

        /* Login error alert (revealed by js/script.js via .show) */
        #loginError {
            display: none;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
            padding: 0.65rem 0.9rem;
            border-radius: 0.75rem;
            font-size: 0.8rem;
            font-weight: 500;
            color: #fecaca;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(248, 113, 113, 0.35);
        }
        #loginError.show { display: flex; }

        @media (prefers-reduced-motion: reduce) {
            .bg-animated-gradient { animation: none; }
            .particle { animation: none; }
        }
    </style>
</head>
<body class="h-screen w-screen relative overflow-hidden bg-slate-900 select-none">

    <!-- BACKGROUND WRAPPER CONTAINER -->
    <div id="bg-container" class="relative w-full h-full bg-animated-gradient transition-all duration-700 flex items-center justify-center p-4">

        <!-- FLOATING PARTICLES (DECORATIVE) -->
        <div class="particle w-3 h-3 top-1/4 left-1/5" style="animation-delay: 0s;"></div>
        <div class="particle w-2 h-2 top-3/4 left-1/4" style="animation-delay: 2s;"></div>
        <div class="particle w-4 h-4 top-1/3 right-1/4" style="animation-delay: 4s;"></div>
        <div class="particle w-2 h-2 top-2/3 right-1/5" style="animation-delay: 1s;"></div>

        <!-- LOGIN CARD OVERLAY -->
        <div id="login-card" class="glass-card relative z-10 w-full max-w-md p-8 md:p-10 rounded-2xl transition-all duration-500 transform">

            <!-- Header -->
            <div class="text-center mb-6">
                <!-- Admin Security Badge -->
                <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/30 text-xs font-semibold uppercase tracking-wider mb-3">
                    <i class="fa-solid fa-user-shield text-amber-400"></i>
                    <span>Admin Access Only</span>
                </div>

                <div class="flex justify-center mb-2">
                    <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 shadow-inner">
                        <i class="fa-solid fa-lock text-2xl"></i>
                    </div>
                </div>
                <h1 id="card-title" class="text-2xl md:text-3xl font-bold text-white tracking-tight">Admin Portal</h1>
                <p id="card-subtitle" class="text-xs md:text-sm text-slate-300 mt-1">Authenticate with administrator credentials</p>
            </div>

            <!-- Form -->
            <form id="adminLoginForm" novalidate class="space-y-4">
                <div class="alert alert-error" id="loginError" role="alert"></div>

                <div>
                    <label for="adminUsername" id="label-username" class="block text-xs font-semibold text-slate-200 uppercase tracking-wider mb-1.5">Admin Username</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">
                            <i class="fa-solid fa-user-tie"></i>
                        </span>
                        <input type="text" id="adminUsername" name="adminUsername" placeholder="admin_username" autocomplete="username" required
                            class="w-full pl-10 pr-4 py-2.5 bg-slate-900/40 border border-slate-600/50 rounded-xl text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-sm transition-all">
                    </div>
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label for="adminPassword" id="label-password" class="block text-xs font-semibold text-slate-200 uppercase tracking-wider">Password</label>
                        <a href="#" class="text-xs text-indigo-300 hover:text-white transition-colors">Reset key?</a>
                    </div>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">
                            <i class="fa-solid fa-key"></i>
                        </span>
                        <input type="password" id="adminPassword" name="adminPassword" placeholder="••••••••••••" autocomplete="current-password" required
                            class="w-full pl-10 pr-4 py-2.5 bg-slate-900/40 border border-slate-600/50 rounded-xl text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-sm transition-all">
                    </div>
                </div>

                <div class="flex items-center justify-between pt-1">
                    <label class="flex items-center cursor-pointer">
                        <input type="checkbox" id="adminRemember" class="w-4 h-4 rounded bg-slate-800 border-slate-600 text-indigo-600 focus:ring-indigo-500 focus:ring-offset-0">
                        <span id="label-remember" class="ml-2 text-xs text-slate-300">Keep session active (HW key)</span>
                    </label>
                </div>

                <button type="submit"
                    class="w-full py-3.5 px-4 bg-indigo-600 hover:bg-indigo-500 active:scale-[0.98] text-white font-semibold rounded-xl shadow-lg shadow-indigo-600/30 transition-all duration-200 text-sm flex items-center justify-center gap-2 mt-2">
                    <i class="fa-solid fa-unlock-keyhole text-xs"></i>
                    <span>Authenticate Admin Portal</span>
                </button>
            </form>

            <!-- Admin Notice Footer -->
            <div class="mt-6 pt-5 border-t border-white/10 text-center">
                <p id="label-signup" class="text-[11px] text-slate-400 flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-triangle-exclamation text-amber-400"></i>
                    <span>Restricted system. All login attempts are logged &amp; audited.</span>
                </p>
            </div>
        </div>
    </div>

    <!-- Real auth flow (admin / admin123), login limiter, redirects -->
    <script src="js/script.js"></script>
</body>
</html>
