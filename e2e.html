<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Community Connect E2E Tests</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f4f6f8; color: #1a1a1a; }
    h1 { font-size: 20px; }
    .note { background: #fff3cd; border: 1px solid #ffe08a; padding: 10px; border-radius: 4px; font-size: 13px; }
    #summary { font-size: 17px; font-weight: bold; margin: 14px 0; padding: 10px 14px; background: #fff; border-radius: 6px; display: inline-block; }
    #summary.done { background: #dff0d8; color: #2b6a2b; }
    #summary.fail { background: #f8d7da; color: #8a1f24; }
    #results { list-style: none; padding: 0; max-width: 900px; }
    #results li { font-size: 13px; padding: 4px 8px; margin-bottom: 2px; border-radius: 3px; background: #fff; }
    #results li.pass::before { content: "PASS  "; color: #1e7e34; font-weight: bold; }
    #results li.fail::before { content: "FAIL  "; color: #b02a37; font-weight: bold; }
    #stage iframe { margin: 6px 6px 0 0; border: 1px solid #ccc; width: 330px; height: 240px; background: #fff; vertical-align: top; }
    #stage { max-width: 1000px; }
  </style>
</head>
<body>
  <h1>Community Connect â€” End-to-End Test Suite</h1>
  <p class="note">
    Warning: this suite clears Community Connect data (news, accounts, settings) for this
    browser origin before running, then seeds its own test content. Run it from a clean
    profile or a local server, not against real data.
  </p>
  <div id="summary">RUNNING...</div>
  <ul id="results"></ul>
  <div id="stage"></div>

  <script>
  (function () {
    "use strict";
    var BASE = "../";
    var results = [];
    var finished = false;
    var summaryEl = document.getElementById("summary");
    var listEl = document.getElementById("results");
    var stage = document.getElementById("stage");

    function record(name, ok, detail) {
      results.push({ name: name, ok: !!ok });
      var li = document.createElement("li");
      li.className = ok ? "pass" : "fail";
      li.textContent = name + (detail ? " [" + detail + "]" : "");
      listEl.appendChild(li);
    }
    function assert(cond, name, detail) { record(name, !!cond, detail); return !!cond; }
    function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

    function finish() {
      if (finished) return;
      finished = true;
      var pass = results.filter(function (r) { return r.ok; }).length;
      var total = results.length;
      var failed = total - pass;
      summaryEl.textContent = "E2E DONE: " + pass + "/" + total + (failed ? " (" + failed + " FAILED)" : "");
      summaryEl.className = failed ? "fail" : "done";
      document.title = "E2E DONE: " + pass + "/" + total;
    }
    setTimeout(finish, 150000); // watchdog for real-browser runs

    function loadPage(src) {
      return new Promise(function (resolve) {
        var f = document.createElement("iframe");
        var done = false;
        var timer = setTimeout(function () {
          if (done) return;
          done = true;
          record("load " + src, false, "timeout");
          try { f.remove(); } catch (e) {}
          resolve(null);
        }, 12000);

        function docReady() {
          try {
            var d = f.contentDocument;
            if (!d || d.readyState !== "complete") return false;
            return d.location.href.indexOf(src.split("#")[0]) >= 0;
          } catch (e) { return false; }
        }
        function settle() {
          if (done) return;
          if (docReady()) {
            done = true;
            clearTimeout(timer);
            setTimeout(function () { resolve(f); }, 500);
          } else {
            setTimeout(settle, 100);
          }
        }
        f.onload = settle;
        f.src = BASE + src;
        stage.appendChild(f);
        setTimeout(settle, 600); // covers load events missed before handler attach
      });
    }

    function closeFrame(f) { if (f) { try { f.remove(); } catch (e) {} } }

    function pageText(f) { return f.contentDocument.documentElement.textContent || ""; }
    function $(f, sel) { return f.contentDocument.querySelector(sel); }
    function $$(f, sel) { return Array.prototype.slice.call(f.contentDocument.querySelectorAll(sel)); }
    function gi(f, id) { return f.contentDocument.getElementById(id); }

    function setInput(el, value) {
      el.value = value;
      el.dispatchEvent(new Event("input", { bubbles: true }));
      el.dispatchEvent(new Event("change", { bubbles: true }));
    }
    function fireSubmit(f, id) {
      var form = gi(f, id);
      if (!form) return false;
      form.dispatchEvent(new Event("submit", { cancelable: true, bubbles: true }));
      return true;
    }
    function esc(f) {
      f.contentDocument.dispatchEvent(new f.contentWindow.KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
    }

    var toastHas = async function (frame, needle) {
      for (var i = 0; i < 14; i++) {
        if ($$(frame, ".toast").filter(function (t) {
          return t.textContent.indexOf(needle) >= 0;
        }).length) return true;
        await sleep(150);
      }
      return false;
    };
    var clearToasts = function (frame) {
      var host = frame.contentDocument.querySelector(".toast-host");
      if (host) host.innerHTML = "";
    };
    var toastTexts = function (frame) {
      return $$(frame, ".toast").map(function (t) { return t.textContent; }).join(" | ");
    };

    function getNews() {
      try { return JSON.parse(localStorage.getItem("communityNews") || "[]"); } catch (e) { return []; }
    }
    function getActivities() {
      try { return JSON.parse(localStorage.getItem("communityActivities") || "[]"); } catch (e) { return []; }
    }
    function getAnnouncements() {
      try { return JSON.parse(localStorage.getItem("communityAnnouncements") || "[]"); } catch (e) { return []; }
    }
    function getUsers() {
      try { return JSON.parse(localStorage.getItem("communityUsers") || "[]"); } catch (e) { return []; }
    }
    function getViewLog() {
      try { return JSON.parse(localStorage.getItem("communityViewLog") || "null"); } catch (e) { return null; }
    }
    function getBookmarks() {
      try { return JSON.parse(localStorage.getItem("communityBookmarks") || "[]"); } catch (e) { return []; }
    }
    function getEvents() {
      try { return JSON.parse(localStorage.getItem("communityEvents") || "[]"); } catch (e) { return []; }
    }
    function getOfficials() {
      try { return JSON.parse(localStorage.getItem("barangayOfficials") || "[]"); } catch (e) { return []; }
    }
    function getCertRequests() {
      try { return JSON.parse(localStorage.getItem("certificateRequests") || "[]"); } catch (e) { return []; }
    }
    function getOfficialNotifs() {
      try { return JSON.parse(localStorage.getItem("communityOfficialNotifications") || "[]"); } catch (e) { return []; }
    }

    async function run() {
      // ---------- 0. bootstrap ----------
      var keys = [];
      for (var i = 0; i < localStorage.length; i++) keys.push(localStorage.key(i));
      keys.forEach(function (k) {
        if (/^(community|userLoggedIn|currentUsername|adminLoggedIn|cc)/.test(k)) {
          try { localStorage.removeItem(k); } catch (e) {}
        }
      });
      sessionStorage.removeItem("ccEmergencyDismissed");
      record("bootstrap: storage cleared", true);

      // ---------- 1. home page ----------
      var f = await loadPage("index.html");
      if (!assert(!!f, "home page loads")) { finish(); return; }
      assert(!!$(f, ".skip-link"), "home: skip link present");
      assert(gi(f, "mainContent") && gi(f, "mainContent").getAttribute("tabindex") === "-1", "home: mainContent focus target");
      var navToggle = gi(f, "navToggle");
      assert(!!navToggle && navToggle.getAttribute("aria-controls") === "mainNav", "home: navToggle aria-controls");
      if (navToggle) {
        navToggle.click();
        assert(gi(f, "mainNav").classList.contains("open") && navToggle.getAttribute("aria-expanded") === "true",
          "home: nav opens + aria-expanded");
        navToggle.click();
        assert(navToggle.getAttribute("aria-expanded") === "false", "home: nav closes + aria-expanded");
      }
      var homeNews = f.contentDocument.querySelectorAll("#homeLatestNews .card, #homeLatestNews article");
      assert(homeNews.length > 0, "home: latest news rendered", homeNews.length + " cards");
      var ld = $$(f, 'script[type="application/ld+json"]');
      assert(ld.length >= 1, "home: JSON-LD present", ld.length + " blocks");
      var jsonOk = ld.length > 0;
      try { JSON.parse(ld[0].textContent); } catch (e) { jsonOk = false; }
      assert(jsonOk, "home: JSON-LD parses");
      assert(!!$(f, 'meta[name="description"]'), "home: meta description");
      assert(!!$(f, 'meta[property="og:title"]'), "home: Open Graph tags");
      var banner = gi(f, "emergencyBanner");
      if (banner) {
        var dismiss = gi(f, "emergencyDismiss");
        if (dismiss) {
          dismiss.click();
          assert(!gi(f, "emergencyBanner"), "home: emergency banner dismisses");
        } else record("home: emergency banner dismiss button", false);
      } else {
        record("home: emergency banner (no active emergency, skipped)", true);
      }
      assert(typeof f.contentWindow.showToast === "function", "home: showToast available");
      f.contentWindow.showToast("E2E toast check", "success");
      await sleep(150);
      var toast = $(f, ".toast");
      assert(!!toast && toast.classList.contains("show") && toast.textContent.indexOf("E2E toast check") >= 0,
        "home: toast appears");
      closeFrame(f);

      // ---------- 2. admin login (wrong then right) ----------
      f = await loadPage("admin-login.html");
      if (assert(!!f, "admin login page loads")) {
        setInput(gi(f, "adminUsername"), "admin");
        setInput(gi(f, "adminPassword"), "wrongpass");
        fireSubmit(f, "adminLoginForm");
        await sleep(300);
        assert(pageText(f).indexOf("Invalid username or password.") >= 0, "admin login: error message shown");
        assert(localStorage.getItem("adminLoggedIn") !== "true", "admin login: rejected on bad password");

        setInput(gi(f, "adminUsername"), "admin");
        setInput(gi(f, "adminPassword"), "admin123");
        fireSubmit(f, "adminLoginForm");
        var okLogin = false;
        for (var t = 0; t < 25; t++) {
          await sleep(150);
          if (localStorage.getItem("adminLoggedIn") === "true") { okLogin = true; break; }
        }
        assert(okLogin, "admin login: admin/admin123 accepted");
      }
      closeFrame(f);

      // ---------- 3. admin: create + pin news ----------
      f = await loadPage("admin.html");
      if (assert(!!f, "admin dashboard loads")) {
        assert(!!$(f, ".skip-link"), "admin: skip link present");
        assert($$(f, ".admin-sidebar a[aria-current='page']").length >= 1, "admin: sidebar aria-current");
        assert(!!gi(f, "exportNewsCsvBtn"), "admin: CSV export button exists");
        assert(typeof f.contentWindow.exportNewsCsv === "function", "admin: exportNewsCsv function exists");
        assert(!!gi(f, "chartViews"), "admin: views chart card exists");
        var chartBars = $$(f, "#chartViews .bar-row");
        assert(chartBars.length > 0, "admin: views chart rendered", chartBars.length + " bars");

        // Settings now lives in the account menu (the header gear is removed)
        assert(!gi(f, "dashSettingsBtn"), "admin: the separate header Settings gear is removed");
        gi(f, "adminAccountBtn").click();
        await sleep(120);
        gi(f, "adminAccountSettings").click();
        await sleep(150);
        assert(gi(f, "adminSettingsModal").classList.contains("open"),
          "admin: the account menu Settings opens the settings modal");
        assert($$(f, "#adminSettingsTabs .settings-tab").length >= 4,
          "admin: settings modal is organised into tabs");
        assert($$(f, "#setTheme button").length === 3, "admin: settings has a Light/Dark/System theme picker");
        assert($$(f, "#setTheme button.active").length === 1, "admin: the current theme is marked");
        var notifTab = $$(f, "#adminSettingsTabs .settings-tab").filter(function (t) {
          return t.getAttribute("data-settings-tab") === "notifications";
        })[0];
        if (assert(!!notifTab, "admin: settings has a Notifications tab")) {
          notifTab.click();
          await sleep(120);
          assert($$(f, "#setNotifList .settings-notif").length >= 3,
            "admin: bell-alert toggles render from the real notification types");
        }
        var usersTab = $$(f, "#adminSettingsTabs .settings-tab").filter(function (t) {
          return t.getAttribute("data-settings-tab") === "users";
        })[0];
        if (assert(!!usersTab, "admin: settings has a Users tab")) {
          usersTab.click();
          await sleep(120);
          assert(!!gi(f, "setOpenUserDir"), "admin: Users tab links to the directory");
        }
        var backupTab = $$(f, "#adminSettingsTabs .settings-tab").filter(function (t) {
          return t.getAttribute("data-settings-tab") === "backup";
        })[0];
        if (assert(!!backupTab, "admin: settings has a Data & Backup tab")) {
          backupTab.click();
          await sleep(120);
          assert(!!gi(f, "exportDataBtn") &&
            !gi(f, "exportDataBtn").closest(".settings-pane").classList.contains("hidden"),
            "admin: backup tools now live inside Settings");
        }
        assert($$(f, ".admin-sidebar a[data-section='backup']").length === 0,
          "admin: no duplicate backup sidebar entry");
        gi(f, "adminSettingsSave").click();
        await sleep(1200);
        assert(!!localStorage.getItem("communityAdminSettings"),
          "admin: saving settings persists them");
        assert(!gi(f, "adminSettingsModal").classList.contains("open"),
          "admin: the settings modal closes after saving");

        // Header account menu
        gi(f, "adminAccountBtn").click();
        await sleep(120);
        assert(!!gi(f, "adminAccountProfile") && !!gi(f, "adminAccountSettings") && !!gi(f, "adminAccountLogout"),
          "account: admin menu lists My Profile, Settings, Sign Out");
        assert(gi(f, "adminMenuEmail").textContent.indexOf("@") >= 0, "account: admin menu shows the email");
        gi(f, "adminAccountSettings").click();
        await sleep(150);
        assert(gi(f, "adminSettingsModal").classList.contains("open"),
          "account: admin Settings opens the settings modal");
        gi(f, "adminSettingsCancel").click();
        await sleep(100);

        var adminBack = $(f, "#adminSidebar a.sidebar-back");
        assert(adminBack && adminBack.getAttribute("href") === "index.html",
          "admin: sidebar has a Back to Website link to index.html");

        setInput(gi(f, "newsTitle"), "E2E Test Article XYZ");
        setInput(gi(f, "newsCategory"), "Health");
        setInput(gi(f, "newsDate"), "2026-10-09");
        setInput(gi(f, "newsDescription"), "Special e2e article used by the automated test suite.");
        setInput(gi(f, "newsImage"), "images/news-01.jpg");
        var submitBtn = gi(f, "newsSubmitBtn");
        assert(!!submitBtn, "admin: news form submit button");
        if (submitBtn) submitBtn.click();
        await sleep(400);
        var created = getNews().filter(function (n) { return n.title === "E2E Test Article XYZ"; });
        assert(created.length === 1, "admin: news created", created.length + " found");
        var newsId = created.length ? created[0].id : null;
        var rowText = gi(f, "newsTableBody") ? gi(f, "newsTableBody").textContent : "";
        assert(rowText.indexOf("E2E Test Article XYZ") >= 0, "admin: news appears in table");

        if (newsId) {
          f.contentWindow.togglePinNews(newsId);
          await sleep(250);
          var pinned = getNews().filter(function (n) { return n.id === newsId && n.pinned; });
          assert(pinned.length === 1, "admin: pin/feature toggles");
          rowText = gi(f, "newsTableBody").textContent;
          assert(rowText.indexOf("FEATURED") >= 0, "admin: FEATURED badge in table row");
        }

        var annLink = $$(f, ".admin-sidebar a[data-section]").filter(function (a) {
          return a.getAttribute("data-section") === "announcements";
        })[0];
        if (annLink) {
          annLink.click();
          await sleep(150);
          assert(annLink.classList.contains("active") && annLink.getAttribute("aria-current") === "page",
            "admin: section switch updates aria-current");
          var newsLink = $$(f, ".admin-sidebar a[data-section]").filter(function (a) {
            return a.getAttribute("data-section") === "news";
          })[0];
          if (newsLink) newsLink.click();
        }

        // ---------- admin table toolbar search + counts ----------
        assert(!!gi(f, "newsTableSearch") && !!gi(f, "annTableSearch") && !!gi(f, "eventTableSearch") &&
          !!gi(f, "activityTableSearch") && !!gi(f, "galleryTableSearch"),
          "admin: table search inputs exist for news/ann/events/activities/gallery");
        var cnt = gi(f, "newsTableCount");
        assert(!!cnt && cnt.textContent.indexOf("items") >= 0, "admin: news table count shows item total",
          cnt ? cnt.textContent.trim() : "missing");

        setInput(gi(f, "newsTableSearch"), "e2e");
        rowText = gi(f, "newsTableBody").textContent;
        assert(rowText.indexOf("E2E Test Article XYZ") >= 0 && rowText.indexOf("No matching results") < 0,
          "admin: table search keeps matching rows");

        setInput(gi(f, "newsTableSearch"), "zzzqqq");
        rowText = gi(f, "newsTableBody").textContent;
        assert(rowText.indexOf("No matching results.") >= 0, "admin: table search shows no-results row");

        setInput(gi(f, "newsTableSearch"), "");
        rowText = gi(f, "newsTableBody").textContent;
        assert(rowText.indexOf("E2E Test Article XYZ") >= 0, "admin: clearing table search restores rows");

        setInput(gi(f, "galleryTableSearch"), "zzzqqq");
        rowText = gi(f, "galleryTableBody").textContent;
        assert(rowText.indexOf("No matching results.") >= 0, "admin: gallery table search shows no-results row");
        setInput(gi(f, "galleryTableSearch"), "");
      }
      closeFrame(f);
      var e2eNewsId = (getNews().filter(function (n) { return n.title === "E2E Test Article XYZ"; })[0] || {}).id || null;

      // ---------- 4. register + user login ----------
      f = await loadPage("register.html");
      if (assert(!!f, "register page loads")) {
        setInput(gi(f, "regUsername"), "e2etest");
        setInput(gi(f, "regPassword"), "test123");
        setInput(gi(f, "regConfirm"), "test123");
        fireSubmit(f, "registerForm");
        await sleep(500);
        assert(getUsers().some(function (u) { return u.username === "e2etest"; }), "register: user stored");
      }
      closeFrame(f);

      f = await loadPage("user-login.html");
      if (assert(!!f, "user login page loads")) {
        assert(!$(f, ".login-back"), "login: the Back to Website link was moved to the dashboards");
        setInput(gi(f, "userUsername"), "e2etest");
        setInput(gi(f, "userPassword"), "nope99");
        fireSubmit(f, "userLoginForm");
        await sleep(300);
        assert(pageText(f).indexOf("Invalid username or password.") >= 0, "user login: error message shown");
        assert(localStorage.getItem("userLoggedIn") !== "true", "user login: rejected on bad password");

        setInput(gi(f, "userUsername"), "e2etest");
        setInput(gi(f, "userPassword"), "test123");
        fireSubmit(f, "userLoginForm");
        var userOk = false;
        for (var t2 = 0; t2 < 25; t2++) {
          await sleep(150);
          if (localStorage.getItem("userLoggedIn") === "true") { userOk = true; break; }
        }
        assert(userOk, "user login: correct password accepted");
      }
      closeFrame(f);

      // ---------- 5. user dashboard ----------
      f = await loadPage("user-dashboard.html");
      if (assert(!!f, "user dashboard loads")) {
        assert(!!gi(f, "dashSavedList"), "dashboard: saved items section");
        assert(!!gi(f, "profileForm"), "dashboard: profile form");
        assert(!gi(f, "dashSettingsBtn"), "dashboard: the separate header Settings gear is removed");
        var savedLink = $$(f, "a[data-usection]").filter(function (a) {
          return a.getAttribute("data-usection") === "saved";
        })[0];
        if (savedLink) {
          savedLink.click();
          await sleep(150);
          assert(savedLink.getAttribute("aria-current") === "page", "dashboard: aria-current on section switch");
        }
        assert(!gi(f, "userLogoutBtn"), "dashboard: sidebar logout button stays removed (header account menu only)");

        // Header account menu: identity + My Profile / Settings / Sign Out
        gi(f, "userAccountBtn").click();
        await sleep(120);
        assert(!gi(f, "userAccountMenu").classList.contains("hidden"), "account: menu opens on name click");
        assert(!!gi(f, "userAccountProfile") && !!gi(f, "userAccountSettings") && !!gi(f, "userAccountLogout"),
          "account: menu lists My Profile, Settings, Sign Out");
        assert(gi(f, "userMenuName").textContent.trim().length > 0, "account: menu shows the display name");
        assert(gi(f, "userMenuEmail").textContent.indexOf("@") >= 0, "account: menu shows the email");
        assert(!!gi(f, "userMenuAvatar"), "account: menu shows an avatar");
        gi(f, "userAccountSettings").click();
        await sleep(120);
        assert(!gi(f, "dashSettingsPanel").classList.contains("hidden"),
          "account: Settings opens the quick settings panel");
        gi(f, "mainContent").click();
        await sleep(80);
        assert(gi(f, "dashSettingsPanel").classList.contains("hidden"),
          "account: clicking away closes the quick settings panel");
        gi(f, "userAccountBtn").click();
        await sleep(100);
        gi(f, "userAccountProfile").click();
        await sleep(150);
        assert(!gi(f, "sectionDashProfile").classList.contains("hidden"),
          "account: My Profile jumps to the profile section");
        f.contentWindow.showUserSection("home");
        await sleep(100);

        // Barangay Services is a clickable label; REQUEST CERTIFICATE is hidden until it is clicked
        var bsToggle = gi(f, "barangayServicesToggle");
        assert(!!bsToggle, "services: Barangay Services label is a clickable control");
        assert(gi(f, "barangayServicesMenu").classList.contains("hidden"),
          "services: REQUEST CERTIFICATE starts hidden");
        if (bsToggle) {
          bsToggle.click();
          await sleep(150);
          assert(!gi(f, "barangayServicesMenu").classList.contains("hidden"),
            "services: clicking Barangay Services reveals REQUEST CERTIFICATE");
          assert(bsToggle.getAttribute("aria-expanded") === "true",
            "services: expanded state is exposed");
          var certLink = $$(f, "#barangayServicesMenu a[data-usection]").filter(function (a) {
            return a.getAttribute("data-usection") === "certificates";
          })[0];
          assert(!!certLink && certLink.textContent.indexOf("REQUEST CERTIFICATE") >= 0,
            "services: REQUEST CERTIFICATE link is inside the group");
          bsToggle.click();
          await sleep(150);
          assert(gi(f, "barangayServicesMenu").classList.contains("hidden"),
            "services: clicking again collapses the group");
        }
      }
      closeFrame(f);

      // Deep link straight to the certificates section opens the group too
      f = await loadPage("user-dashboard.html#certificates");
      if (assert(!!f, "services: certificates deep link loads")) {
        assert(!gi(f, "sectionDashCertificates").classList.contains("hidden"),
          "services: certificates section is shown from the deep link");
        assert(!gi(f, "barangayServicesMenu").classList.contains("hidden"),
          "services: the group auto-expands when its section is shown");
      }
      closeFrame(f);

      // ---------- 6. public news: search, filters, URL, featured ----------
      f = await loadPage("news.html");
      if (assert(!!f, "news page loads")) {
        assert(!!gi(f, "newsCatFilter") && !!gi(f, "newsDateFilter"), "news: category + date filters");
        setInput(gi(f, "newsSearch"), "E2E");
        await sleep(300);
        var countText = gi(f, "newsCount") ? gi(f, "newsCount").textContent : "";
        assert(countText.indexOf("news found") >= 0, "news: result count text", countText.trim());
        var marks = $$(f, "#newsList mark.hl");
        assert(marks.length > 0, "news: search terms highlighted", marks.length + " marks");
        assert(f.contentWindow.location.hash.indexOf("q=E2E") >= 0, "news: URL hash synced", f.contentWindow.location.hash);
        assert(pageText(f).indexOf("E2E Test Article XYZ") >= 0, "news: matching article listed");
        var pubFeedCards = $$(f, "#newsList .feed-card");
        assert(pubFeedCards.length >= 1, "news: renders Facebook-style feed cards",
          pubFeedCards.length + " cards");
        assert(!!$(f, "#newsList .feed-actions") && !!$(f, "#newsList .feed-image-wrap, #newsList .feed-image"),
          "news: feed card has action bar + media");

        setInput(gi(f, "newsSearch"), "zzzqqq");
        await sleep(300);
        assert(pageText(f).indexOf("No news found") >= 0, "news: empty state on no match");

        setInput(gi(f, "newsSearch"), "");
        setInput(gi(f, "newsCatFilter"), "Health");
        await sleep(300);
        assert(pageText(f).indexOf("E2E Test Article XYZ") >= 0, "news: category filter keeps Health article");
        assert(f.contentWindow.location.hash.indexOf("cat=Health") >= 0, "news: category in URL hash");
        setInput(gi(f, "newsCatFilter"), "");
        setInput(gi(f, "newsDateFilter"), "year");

        assert(!gi(f, "sectionOffProfile").classList.contains("hidden"),
          "account: official My Profile opens the profile section");
        f.contentWindow.showOfficialSection("dashboard");
        await sleep(100);
        assert(gi(f, "statOffPending") && gi(f, "statOffPending").textContent === "1",
          "official: pending stats reflect only this barangay's request",
          gi(f, "statOffPending") ? gi(f, "statOffPending").textContent : "");
        assert(gi(f, "requestsTableBody") && gi(f, "requestsTableBody").textContent.indexOf(reqRef) >= 0,
          "official: request listed in the requests table");
        assert(gi(f, "requestsTableBody") && gi(f, "requestsTableBody").textContent.indexOf("CC-2026-99999") < 0,
          "official: a request for another barangay is NOT listed");
        assert(gi(f, "offRecentRequests") && gi(f, "offRecentRequests").textContent.indexOf(reqRef) >= 0,
          "official: request shown in Recent Certificate Requests");

        if (reqId) {
          f.contentWindow.openCertRequestDetail(reqId, true);
          await sleep(250);
          assert(!!$(f, "#detailModal.open"), "official: review dialog opens for a request");
          assert(!!gi(f, "certPrintBtn"), "official: PRINT CERTIFICATE button is available");
          assert(!!gi(f, "certReadyBtn"), "official: pending request can be marked ready");
          f.contentWindow.markCertRequestReady(reqId);
          await sleep(250);
          var readyReq = getCertRequests().filter(function (r) { return r.id === reqId; })[0];
          assert(readyReq && readyReq.status === "ready", "official: request marked ready for pickup");
        }

        // Facebook-style community content, identical to what residents see
        assert(gi(f, "dashNewsList") && gi(f, "dashNewsList").textContent.indexOf("ZZ Official News") >= 0,
          "official: Facebook-style news feed shows admin news");
        assert(gi(f, "dashAnnouncementsList") && gi(f, "dashAnnouncementsList").textContent.indexOf("ZZ Official Announcement") >= 0,
          "official: Facebook-style announcements feed shows admin posts");
        assert(!!$(f, "#dashNewsList .feed-card"), "official: news renders as Facebook-style feed cards");
        assert(!!$(f, "#dashNewsList .feed-actions button[data-like-news]"), "official: feed cards have a Like button");
        assert(!!$(f, "#dashNewsList .feed-actions button[data-save-news]"), "official: feed cards have a Save button");
        assert(!!$(f, "#dashAnnouncementsList .feed-card"), "official: announcements render as feed cards");

        // Only the missing sections were added (Events, Activities, Gallery)
        var offNav = $$(f, "#officialSidebar a[data-osection]").map(function (a) {
          return a.getAttribute("data-osection");
        });
        assert(offNav.indexOf("events") >= 0, "official: sidebar adds UPCOMING EVENTS");
        assert(offNav.indexOf("activities") >= 0, "official: sidebar adds ACTIVITIES");
        assert(offNav.indexOf("gallery") >= 0, "official: sidebar adds GALLERY");
        assert(!!gi(f, "sectionOffEvents") && !!gi(f, "dashEventsList"),
          "official: Upcoming Events section exists");
        assert(!!gi(f, "sectionOffActivities") && !!gi(f, "dashActivitiesList"),
          "official: Activities section exists");
        assert(!!gi(f, "sectionOffGallery") && !!gi(f, "dashGalleryGrid"),
          "official: Gallery section exists");

        // Interactions work for officials (they act as an official identity)
        var offLike = $(f, "#dashNewsList button[data-like-news='off_news']");
        if (assert(!!offLike, "official: can interact with a post (Like button)")) {
          offLike.click();
          await sleep(200);
          var offLikes = JSON.parse(localStorage.getItem("communityNewsLikes") || "{}");
          assert((offLikes.off_news || 0) >= 1, "official: liking a post increments the count",
            String(offLikes.off_news || 0));
        }

        // The added sections open from the sidebar
        f.contentWindow.showOfficialSection("gallery");
        await sleep(150);
        assert(!gi(f, "sectionOffGallery").classList.contains("hidden"),
          "official: Gallery section opens");
        var galleryNav = $$(f, "#officialSidebar a[data-osection='gallery']").length;
        assert(galleryNav === 1, "official: gallery nav item is not duplicated", galleryNav + " links");
        f.contentWindow.showOfficialSection("requests");
        await sleep(100);

        var offDot = gi(f, "officialNotifDot");
        assert(!!offDot && !offDot.hidden, "official: notification bell shows an unread alert");
        assert(offDot.textContent === "1",
          "official: the bell counts only this barangay's alert",
          offDot ? offDot.textContent : "");
        gi(f, "officialNotifBtn").click();
        await sleep(250);
        var offPanel = gi(f, "officialNotifPanel");
        assert(offPanel && !offPanel.classList.contains("hidden"), "official: notification panel opens");
        assert(offPanel && offPanel.textContent.indexOf(reqRef) >= 0,
          "official: certificate notification names the request");
        assert(offPanel && offPanel.textContent.indexOf("CC-2026-99999") < 0,
          "official: a notification for another barangay is NOT shown");
        await sleep(150);
        var notifsAfterOpen = getOfficialNotifs();
        var otherN = notifsAfterOpen.filter(function (n) { return n.id === "zz_other_notif"; })[0];
        assert(otherN && otherN.read === false,
          "official: another barangay's alert stays unread (no cross-barangay leak)");
        var mineN = notifsAfterOpen.filter(function (n) { return n.requestId === reqId; })[0];
        assert(mineN && mineN.read === true,
          "official: this barangay's alert is marked read");

        assert(!!gi(f, "sectionOffProfile"), "official: MY PROFILE section exists");
        f.contentWindow.showOfficialSection("profile");
        await sleep(150);
        assert(!gi(f, "sectionOffProfile").classList.contains("hidden"),
          "official: profile section becomes active");
        assert(gi(f, "offProfileName") && gi(f, "offProfileName").value === "ZZ Kagawad Reyes",
          "official: profile form is prefilled with the official's name");
        assert(gi(f, "offProfileBarangay") && gi(f, "offProfileBarangay").value === "Barangay San Roque",
          "official: profile shows the barangay the official belongs to");
        setInput(gi(f, "offProfileName"), "ZZ Kagawad Reyes Jr");
        setInput(gi(f, "offProfilePhone"), "0917-555-6666");
        fireSubmit(f, "officialProfileForm");
        await sleep(300);
        var updatedOfficial = getOfficials().filter(function (o) { return o.username === "zzofficial"; })[0];
        assert(updatedOfficial && updatedOfficial.name === "ZZ Kagawad Reyes Jr",
          "official: profile changes are saved");
        assert(updatedOfficial && updatedOfficial.phone === "0917-555-6666",
          "official: profile contact details are saved");

        assert(gi(f, "offProfileSuccess").classList.contains("show"),
          "official: success message shown after saving");
        assert(gi(f, "offProfileSuccess").textContent.indexOf("saved successfully") >= 0,
          "official: success message wording");

        var offProfClose = gi(f, "offProfileCloseBtn");
        assert(!!offProfClose, "official: profile has a circular X close button");
        if (offProfClose) {
          offProfClose.click();
          await sleep(150);
          assert(!gi(f, "sectionOffDashboard").classList.contains("hidden"),
            "official: the close button returns to the dashboard");
        }
      }
      closeFrame(f);

      // Clean up the officials + certificate fixtures
      localStorage.setItem("barangayOfficials", "[]");
      localStorage.setItem("certificateRequests", "[]");
      localStorage.setItem("communityOfficialNotifications", "[]");
      localStorage.setItem("communityNews", "[]");
      localStorage.setItem("communityAnnouncements", "[]");
      localStorage.setItem("communityUsers", "[]");
      localStorage.setItem("userLoggedIn", "false");
      localStorage.setItem("officialLoggedIn", "false");
      localStorage.removeItem("currentUsername");
      localStorage.removeItem("currentOfficial");

      // ---------- 15. offline fallback page ----------
      f = await loadPage("offline.html");
      if (assert(!!f, "offline.html loads")) {
        assert(pageText(f).indexOf("You are offline") >= 0, "offline: fallback message present");
        assert(!!gi(f, "retryBtn"), "offline: retry button");
      }
      closeFrame(f);

      finish();
    }

    run().catch(function (err) {
      record("runner crashed: " + (err && err.message ? err.message : err), false,
        err && err.stack ? String(err.stack).split("\n").slice(0, 3).join(" @ ") : "");
      finish();
    });
  })();
  </script>
</body>
</html>
